apiVersion: apps/v1
kind: Deployment
metadata:
  name: analyzer
  labels:
    app.kubernetes.io/name: analyzer
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: analyzer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: analyzer
    spec:
      serviceAccountName: analyzer
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: analyzer
      containers:
        - name: analyzer
          image: analyzer
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: gemini
                  key: api-key
                  optional: true
            - name: GEMINI_MODEL
              value: gemini-2.5-flash
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
