# Read-only access to pods and events across the cluster, nothing else.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: analyzer
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: aiops-analyzer-read
rules:
  - apiGroups: [""]
    resources: ["pods", "events"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: aiops-analyzer-read
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: aiops-analyzer-read
subjects:
  - kind: ServiceAccount
    name: analyzer
    namespace: aiops
