apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: aiops

resources:
  - namespace.yaml
  - rbac.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - hpa.yaml

labels:
  - pairs:
      app.kubernetes.io/part-of: aiops
    includeSelectors: false

# CI replaces this with the ECR repository URL and the commit SHA.
images:
  - name: analyzer
    newName: analyzer
    newTag: latest
