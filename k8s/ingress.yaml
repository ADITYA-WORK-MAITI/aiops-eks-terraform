# Provisioned as an internet-facing Application Load Balancer by the
# AWS Load Balancer Controller. Traffic goes straight to pod IPs (target-type ip).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: analyzer
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
    alb.ingress.kubernetes.io/healthcheck-path: /healthz
    # Restrict who can reach the API; widen or narrow as needed.
    alb.ingress.kubernetes.io/inbound-cidrs: 0.0.0.0/0
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: analyzer
                port:
                  name: http
