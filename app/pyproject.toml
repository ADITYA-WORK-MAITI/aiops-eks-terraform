[project]
name = "aiops-analyzer"
version = "1.0.0"
description = "AI-assisted incident analysis for Kubernetes workloads on Amazon EKS"
requires-python = ">=3.12"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
